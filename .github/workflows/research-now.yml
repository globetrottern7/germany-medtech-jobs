name: Research Now

on:
  workflow_dispatch:

concurrency:
  group: medtech-research
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run fresh Germany-wide research
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python scripts/research_jobs.py

      - name: Commit updated research data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/jobs.json data/reports.json data/research-status.json
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "Run fresh Germany MedTech job research"
            git push
          fi
