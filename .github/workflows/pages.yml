name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:
  # Called by daily-research.yml: commits pushed with GITHUB_TOKEN do not trigger `push` workflows.
  workflow_call:
    inputs:
      ref:
        description: Commit to deploy
        type: string
        required: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  validate:
    name: Validate production publication
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - name: Unit tests
        run: node --test scripts/test/*.test.js
      - name: Validate production publication
        run: node scripts/validate-publication.js

  deploy:
    name: Deploy validated site
    needs: validate
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
